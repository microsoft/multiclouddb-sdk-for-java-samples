# ---------------------------------------------------------------------------
#  Change Feed Samples — Azure Cosmos DB Emulator Configuration
# ---------------------------------------------------------------------------
#
#  Default config used by ChangeFeedSample and ChangeFeedWatcherSample when
#  no -Dmulticlouddb.config is supplied. Targets the local Cosmos emulator
#  (https://localhost:8081).
#
#  NOTE: the emulator caps AVAD ChangeFeedPolicy retention at 10 minutes, so
#  the samples provision the demo container directly via the Cosmos SDK at a
#  10-min policy as a workaround. See ChangeFeedSample javadoc for details.
#
# --- Provider Selection -----------------------------------------------------
multiclouddb.provider=cosmos

# --- Application Settings ---------------------------------------------------
# Separate database from the Todo App sample so the two can coexist.
multiclouddb.database=multiclouddb-sdk-for-java-changefeed
multiclouddb.collection=change-feed-demo

# --- Azure Cosmos DB (Emulator) ---------------------------------------------
multiclouddb.connection.endpoint=https://localhost:8081
multiclouddb.connection.key=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
multiclouddb.connection.connectionMode=gateway

# --- Throughput (optional) ---------------------------------------------------
# Cosmos DB assigns ~1 physical partition per 10,000 RU/s of provisioned
# throughput, so each partition maps to one change-feed cursor. To see
# multiple cursors in the sample output:
#   multiclouddb.throughput=30000   →  3 physical partitions / 3 cursors
#   multiclouddb.throughput=50000   →  5 physical partitions / 5 cursors
# Leave commented out (or set to 0) to use the Cosmos default (~400 RU/s
# → 1 partition → 1 cursor).
# multiclouddb.throughput=30000
