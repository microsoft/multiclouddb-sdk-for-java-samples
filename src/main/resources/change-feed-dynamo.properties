# ---------------------------------------------------------------------------
#  Change Feed Sample — Amazon DynamoDB Local
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-dynamo.properties
#
#  Used by all three change-feed samples:
#
#  - ChangeFeedSample / ChangeFeedWatcherSample: reads change events from
#    DynamoDB Streams. Requires the table to have
#    StreamSpecification(NEW_AND_OLD_IMAGES) enabled; without it the SDK
#    surfaces UNSUPPORTED_CAPABILITY(stream_not_enabled).
#
#  - ChangeFeedExtendedRetentionSample: demonstrates the build-time
#    capability gate REFUSING extended retention — DynamoDB Streams is
#    fixed at 24h server-side. The gate fires before any wire I/O, so this
#    config works even without a running DynamoDB Local endpoint.
#
#  Prerequisites:
#    docker run -p 8000:8000 amazon/dynamodb-local
#    (not needed for the extended-retention gate demo — see README)
# ---------------------------------------------------------------------------

multiclouddb.provider=dynamo

# --- Application Settings ---------------------------------------------------
multiclouddb.database=local
multiclouddb.collection=change-feed-demo

# --- Amazon DynamoDB (Local) ------------------------------------------------
multiclouddb.connection.endpoint=http://localhost:8000
multiclouddb.connection.region=us-east-1

# DynamoDB Local accepts any credentials
multiclouddb.auth.accessKeyId=fakeMyKeyId
multiclouddb.auth.secretAccessKey=fakeSecretAccessKey
