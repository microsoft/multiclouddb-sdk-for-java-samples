# ---------------------------------------------------------------------------
#  Change Feed Sample — Amazon DynamoDB Local
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-dynamo.properties
#
#  Used by ChangeFeedExtendedRetentionSample to demonstrate the SDK's
#  build-time capability gate REFUSING extended retention on a provider that
#  does not declare Capability.EXTENDED_CHANGE_FEED_HISTORY. DynamoDB Streams
#  is fixed at 24 hours server-side; the SDK fails fast in
#  MulticloudDbClientFactory.create(...) with
#  MulticloudDbErrorCategory.UNSUPPORTED_CAPABILITY (reason
#  "extended_retention_unavailable") BEFORE any network I/O — so this config
#  produces the same outcome as the live-AWS config (exit code 1) without
#  needing real AWS credentials or a live table.
#
#  Note: ChangeFeedSample and ChangeFeedWatcherSample DO NOT support DynamoDB
#  in this repo — the SDK gates Capability.CHANGE_FEED to Cosmos, so those
#  samples will print "Change feed is not supported on Amazon DynamoDB" and
#  exit. See README-change-feed.md for details.
#
#  Prerequisites (only needed if you want a running endpoint; the build-time
#  gate refuses extended retention before any wire I/O so the endpoint is
#  never actually contacted):
#    docker run -p 8000:8000 amazon/dynamodb-local
# ---------------------------------------------------------------------------

multiclouddb.provider=dynamo

# --- Application Settings ---------------------------------------------------
multiclouddb.database=local
multiclouddb.collection=change-feed-demo

# --- Amazon DynamoDB (Local) ------------------------------------------------
multiclouddb.connection.endpoint=http://localhost:8000
multiclouddb.connection.region=us-east-1

# DynamoDB Local accepts any credentials
multiclouddb.auth.accessKeyId=fakeMyKeyId
multiclouddb.auth.secretAccessKey=fakeSecretAccessKey
