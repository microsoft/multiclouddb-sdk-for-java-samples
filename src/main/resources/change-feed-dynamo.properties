# ---------------------------------------------------------------------------
#  Change Feed Sample — Amazon DynamoDB Local
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-dynamo.properties
#
#  NOTE: DynamoDB change-feed support is not yet available in this repo.
#  This config file is retained for future use. The change-feed samples
#  currently exit early unless the provider is set to 'cosmos'.
# ---------------------------------------------------------------------------

multiclouddb.provider=dynamo

# --- Application Settings ---------------------------------------------------
multiclouddb.database=local
multiclouddb.collection=change-feed-demo

# --- Amazon DynamoDB (Local) ------------------------------------------------
multiclouddb.connection.endpoint=http://localhost:8000
multiclouddb.connection.region=us-east-1

# DynamoDB Local accepts any credentials
multiclouddb.auth.accessKeyId=fakeMyKeyId
multiclouddb.auth.secretAccessKey=fakeSecretAccessKey
