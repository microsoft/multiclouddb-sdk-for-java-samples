# ---------------------------------------------------------------------------
#  Change Feed Sample — Google Cloud Spanner Emulator
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-spanner.properties
#
#  NOTE: Spanner change-feed support is not yet available in this repo.
#  This config file is retained for future use. The change-feed samples
#  currently exit early unless the provider is set to 'cosmos'.
# ---------------------------------------------------------------------------

multiclouddb.provider=spanner

# --- Application Settings ---------------------------------------------------
multiclouddb.database=multiclouddb-sdk-for-java-changefeed
multiclouddb.collection=change-feed-demo

# --- Google Cloud Spanner (Emulator) ----------------------------------------
multiclouddb.connection.projectId=test-project
multiclouddb.connection.instanceId=test-instance
multiclouddb.connection.databaseId=multiclouddb-sdk-for-java-changefeed
multiclouddb.connection.emulatorHost=localhost:9010
