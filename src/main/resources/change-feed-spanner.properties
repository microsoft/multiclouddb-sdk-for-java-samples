# ---------------------------------------------------------------------------
#  Change Feed Sample — Google Cloud Spanner Emulator
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-spanner.properties
#
#  Used by all three change-feed samples:
#
#  - ChangeFeedSample / ChangeFeedWatcherSample: reads change events from
#    a Spanner Change Stream. Requires a change stream to be created:
#      CREATE CHANGE STREAM <name> FOR <collection>
#        OPTIONS(value_capture_type='NEW_ROW')
#    Without it the SDK surfaces UNSUPPORTED_CAPABILITY(stream_not_enabled).
#
#  - ChangeFeedExtendedRetentionSample: demonstrates the build-time
#    capability gate PASSING — Spanner declares
#    Capability.EXTENDED_CHANGE_FEED_HISTORY. The gate fires before any
#    wire I/O, so this works even without a running emulator.
#
#  Prerequisites:
#    docker run -p 9010:9010 -p 9020:9020 gcr.io/cloud-spanner-emulator/emulator
#    (not needed for the extended-retention gate demo — see README)
# ---------------------------------------------------------------------------

multiclouddb.provider=spanner

# --- Application Settings ---------------------------------------------------
multiclouddb.database=multiclouddb-sdk-for-java-changefeed
multiclouddb.collection=change-feed-demo

# --- Google Cloud Spanner (Emulator) ----------------------------------------
multiclouddb.connection.projectId=test-project
multiclouddb.connection.instanceId=test-instance
multiclouddb.connection.databaseId=multiclouddb-sdk-for-java-changefeed
multiclouddb.connection.emulatorHost=localhost:9010
