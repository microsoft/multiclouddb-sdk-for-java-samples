# ---------------------------------------------------------------------------
#  Change Feed Sample — Google Cloud Spanner Emulator
# ---------------------------------------------------------------------------
#  Usage: -Dmulticlouddb.config=change-feed-spanner.properties
#
#  Used by ChangeFeedExtendedRetentionSample to demonstrate the SDK's
#  build-time capability gate against the local Spanner emulator. The gate
#  passes (Spanner declares Capability.EXTENDED_CHANGE_FEED_HISTORY) without
#  issuing any wire I/O, so this works against the emulator the same way it
#  does against live Spanner.
#
#  Note: ChangeFeedSample and ChangeFeedWatcherSample DO NOT support Spanner
#  in this repo — the SDK gates Capability.CHANGE_FEED to Cosmos, so those
#  samples will print "Change feed is not supported on Google Cloud Spanner"
#  and exit. See README-change-feed.md for details.
#
#  Prerequisites:
#    docker run -p 9010:9010 -p 9020:9020 gcr.io/cloud-spanner-emulator/emulator
#  The emulator does not require a real instance or database to be created
#  ahead of time for the build-time gate demo — the sample only constructs
#  the SDK client; no DDL or DML is issued.
# ---------------------------------------------------------------------------

multiclouddb.provider=spanner

# --- Application Settings ---------------------------------------------------
multiclouddb.database=multiclouddb-sdk-for-java-changefeed
multiclouddb.collection=change-feed-demo

# --- Google Cloud Spanner (Emulator) ----------------------------------------
multiclouddb.connection.projectId=test-project
multiclouddb.connection.instanceId=test-instance
multiclouddb.connection.databaseId=multiclouddb-sdk-for-java-changefeed
multiclouddb.connection.emulatorHost=localhost:9010
